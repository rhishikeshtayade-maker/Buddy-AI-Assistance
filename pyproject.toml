[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-assistant"
version = "0.1.0"
description = "BUDDY — Advanced Secure AI Desktop Voice Assistant for Windows"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lead Architect & Engineering Team", email = "engineering@buddy.local" }
]
license = { text = "Proprietary / All Rights Reserved" }
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "keyring>=24.3.0",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
]

[project.scripts]
buddy = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
